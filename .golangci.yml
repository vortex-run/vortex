# golangci-lint configuration for VORTEX.
#
# Conservative, high-signal linter set for the M1.1 foundation. As the codebase
# grows we tighten this rather than loosen it. Aligned with golangci-lint v2.x.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose # HTTP response bodies closed
    - misspell # common misspellings
    - revive # style/lint replacement for golint
    - unconvert # redundant type conversions
  settings:
    staticcheck:
      # The defaults, minus quick-fix suggestions, which report style preferences
      # rather than defects.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Allow relaxed checks in test files.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
