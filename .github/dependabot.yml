# Dependabot keeps Go modules, the dashboard npm lockfile, and GitHub Actions
# current so weekly govulncheck does not become the only discovery path for
# known CVEs (see the six weeks of red Security Scan before this sprint).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # raft v1.7.3 and memberlist v0.5.4 import github.com/hashicorp/go-metrics/compat,
      # which go-metrics v0.7.0 removed (v0.6.x still ships it), so bumping this
      # indirect dependency to v0.7 breaks `go mod tidy` and fails the whole
      # grouped update. Remove once raft and memberlist stop importing compat.
      - dependency-name: github.com/hashicorp/go-metrics
        versions: [">= 0.7.0"]
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /web/dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint 8.72 requires typescript <6.1.0, so a TypeScript 7
      # bump breaks npm ci. Remove once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Tailwind 4 moved its PostCSS plugin and config, which breaks the build.
      # Remove when the dashboard is migrated.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
    groups:
      dashboard-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # init, autobuild, analyze and upload-sarif must share a version, so
      # separate PRs for them can never pass CI.
      codeql-action:
        patterns:
          - "github/codeql-action*"
