# VORTEX release pipeline (build plan M1.6).
#
# Triggered only by pushing a v* tag. Runs the full race-enabled test suite as a
# gate, then GoReleaser builds the multi-platform binaries and publishes them
# with SHA-256 checksums and an auto-generated changelog to a GitHub release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required for GoReleaser to create the GitHub release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is mandatory: GoReleaser derives the changelog from the
          # commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          # The most important of the three: without it, released binaries are
          # built with whatever Go patch happens to be cached on the runner, so
          # a shipped artifact can carry standard-library vulnerabilities that
          # were fixed weeks earlier.
          check-latest: true
          cache: true

      - name: Run tests before release
        run: go test -race ./...

      # syft must be on PATH before GoReleaser runs: the sboms block in
      # .goreleaser.yaml shells out to it for the per-archive SPDX documents.
      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@latest

      # osslsigncode Authenticode-signs the Windows binary so it ships with a
      # real publisher instead of "Publisher: Unknown" in the firewall and
      # SmartScreen prompts. Installed unconditionally because the signing
      # wrapper decides at runtime whether a certificate is configured;
      # installing it is cheap and keeps the release step branch-free.
      - name: Install osslsigncode
        run: sudo apt-get update && sudo apt-get install -y osslsigncode

      # When VORTEX_SIGNING_KEY is unset the sign wrapper creates no .sig, but
      # GoReleaser would still try to upload checksums.txt.sig and fail — so
      # skip the sign step entirely and ship an integrity-only release.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean ${{ secrets.VORTEX_SIGNING_KEY == '' && '--skip=sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 signing key for checksums.txt (production audit H4). When
          # the secret is unset the sign wrapper no-ops and the release is
          # integrity-only.
          VORTEX_SIGNING_KEY: ${{ secrets.VORTEX_SIGNING_KEY }}
          # Authenticode code-signing certificate for the Windows binary. This
          # is what populates the Windows "Publisher" field. When unset,
          # scripts/sign-windows.sh no-ops and the binary ships unsigned, so
          # snapshot and fork builds still succeed.
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASS }}
          # Cross-repo PAT for pushing the Homebrew cask to
          # vortex-run/homebrew-tap. When unset the cask upload is skipped
          # (see homebrew_casks.skip_upload in .goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Whole-repository SBOM (source dependencies, not just the shipped
      # archives) kept as a workflow artifact for audit/compliance trails.
      - name: Generate SBOM
        run: syft packages . -o spdx-json > vortex-sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: vortex-sbom.json
