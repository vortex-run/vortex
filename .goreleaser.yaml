# GoReleaser configuration for Gubern (formerly VORTEX; build plan M1.6).
#
# Produces static, single-binary releases for every supported platform and
# publishes them with SHA-256 checksums and an auto-generated changelog on each
# v* tag. CGO is disabled so the binaries are fully static and cross-compile
# cleanly. Run `goreleaser check` to validate, `goreleaser release --snapshot
# --clean` to build all platforms locally without publishing.
#
# M19 adds supply-chain hardening: each archive gets an SPDX SBOM generated by
# syft (must be on PATH — the release workflow installs it), and checksums.txt
# covers every artifact so `gubern verify` and scripts/verify-release.sh can
# validate downloads end-to-end.
#
# Rename bridge: besides gubern_<os>_<arch> archives, every release also
# publishes vortex_<os>_<arch> archives holding the same program as a binary
# named `vortex`. Installs from before the rename look for exactly those names
# when they self-update (internal/update/compat_test.go pins them). Drop the
# legacy build and archives only once no supported install predates the rename.
version: 2

project_name: gubern

before:
  hooks:
    - go mod tidy
    - go generate ./...
    # License and NOTICE texts of every bundled Go module and dashboard npm
    # package (MIT/BSD require them in binary distributions; Apache-2.0
    # requires NOTICE files to be passed on). Fails if any dependency ships
    # no license. The release workflow runs `npm ci` first, so node_modules
    # is present.
    - go run ./scripts/licenses -o THIRD_PARTY_LICENSES

builds:
  - id: gubern
    main: ./cmd/gubern
    binary: gubern
    env: &build_env
      - CGO_ENABLED=0
    flags: &build_flags
      - -trimpath
      # The `release` tag makes the human-approval gate on agent command
      # execution unwaivable in shipped binaries (production audit I6).
      # Without it a struct literal that omits RequireApproval — whose zero
      # value is false — yields an ungated command executor.
      - -tags=release
    ldflags: &build_ldflags
      - -s -w
      - -X github.com/vortex-run/vortex/internal/cmd.version={{.Version}}
      - -X github.com/vortex-run/vortex/internal/cmd.commit={{.Commit}}
      - -X github.com/vortex-run/vortex/internal/cmd.date={{.Date}}
    goos: &build_goos
      - linux
      - darwin
      - windows
    goarch: &build_goarch
      - amd64
      - arm64
    ignore: &build_ignore
      - goos: windows
        goarch: arm64

  # Same program under its pre-rename name, for the legacy archives below.
  - id: vortex-legacy
    main: ./cmd/gubern
    binary: vortex
    env: *build_env
    flags: *build_flags
    ldflags: *build_ldflags
    goos: *build_goos
    goarch: *build_goarch
    ignore: *build_ignore

archives:
  - id: default
    ids: [gubern]
    name_template: >-
      gubern_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_LICENSES
      - README.md
      - gubern.cue

  - id: vortex-legacy
    ids: [vortex-legacy]
    name_template: >-
      vortex_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_LICENSES
      - README.md
      # Older installers seed the example config from vortex.cue.
      - src: gubern.cue
        dst: vortex.cue

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Ed25519 signature over checksums.txt (production audit H4). The signing
# private key is provided by the release workflow as the repository secret
# VORTEX_SIGNING_KEY (its name predates the rename); the matching public key
# is pinned in the binary (internal/update/signature.go). `gubern self-update`
# verifies this signature before installing. When the key is unset the
# signing command is a no-op wrapper that skips signing, so unsigned snapshot
# builds still work.
signs:
  - id: checksums
    cmd: bash
    args:
      - "scripts/sign-ci.sh"
      - "${artifact}"
    artifacts: checksum
    output: true

# Authenticode signature on the Windows binary. This is what makes Windows show
# a real publisher instead of "Publisher: Unknown" in the firewall prompt and
# SmartScreen — an operator authorising an inbound rule for an unsigned binary
# has no cryptographic evidence of who produced it.
#
# Distinct from the checksum signature above: that proves the release manifest
# came from us, but Windows never reads it. Only an Authenticode signature on
# the .exe itself populates the publisher field.
#
# The wrapper no-ops when WINDOWS_CERT_BASE64 is unset, so snapshot and fork
# builds still succeed. It activates once a maintainer provisions a real
# code-signing certificate; one cannot be generated here, because its value
# rests entirely on a CA having verified the holder's identity.
binary_signs:
  - id: windows-authenticode
    cmd: bash
    args:
      - "scripts/sign-windows.sh"
      - "${artifact}"
    output: true

# SPDX SBOM per archive, generated by syft and uploaded as a release asset
# alongside the archive it describes. Named after the archive, so the gubern
# and legacy vortex archives of a platform get distinct SBOM files.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New features"
      regexp: "^feat"
      order: 0
    - title: "Bug fixes"
      regexp: "^fix"
      order: 1
    - title: "Other"
      order: 999

# Linux distro packages (deb/rpm/apk) built from the same binaries (M20).
# The package replaces the pre-rename `vortex` package; /usr/bin/vortex stays
# as a link so existing scripts and service units keep working.
nfpms:
  - id: gubern
    ids: [gubern]
    package_name: gubern
    vendor: Gubern Contributors
    homepage: "https://vortex.run"
    maintainer: Gubern Contributors <maintainers@vortex.run>
    description: Gubern (formerly VORTEX) — autonomous infrastructure platform (proxy, security, AI agent)
    license: Apache-2.0
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    replaces: [vortex]
    conflicts: [vortex]
    provides: [vortex]
    contents:
      - src: gubern.cue
        dst: /etc/gubern/gubern.cue
        type: config|noreplace
      - src: /usr/bin/gubern
        dst: /usr/bin/vortex
        type: symlink
      - src: LICENSE
        dst: /usr/share/doc/gubern/LICENSE
      - src: THIRD_PARTY_LICENSES
        dst: /usr/share/doc/gubern/THIRD_PARTY_LICENSES

# Homebrew cask (M20). Published to vortex-run/homebrew-tap on release.
# (GoReleaser replaced the deprecated `brews:` formula block with casks.)
# Pushing to the tap needs a cross-repo PAT (HOMEBREW_TAP_TOKEN secret) — the
# workflow's GITHUB_TOKEN is scoped to this repo only. When the secret is
# unset the cask is generated but not uploaded, keeping the release green.
# The cask is now `gubern`; the old `vortex` cask in the tap is not updated.
homebrew_casks:
  - name: gubern
    ids: [default]
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}{{ if .Env.HOMEBREW_TAP_TOKEN }}false{{ else }}true{{ end }}{{ else }}true{{ end }}'
    repository:
      owner: vortex-run
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    description: "One binary. Any server. Fully autonomous."
    homepage: "https://vortex.run"

release:
  github:
    owner: vortex-run
    name: vortex
  draft: false
  prerelease: auto
  name_template: "Gubern {{.Tag}}"
